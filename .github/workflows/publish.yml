name: Publish to NPM

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  publish:
    environment: npm-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs the Node and Yarn versions pinned in the `volta` field of package.json.
      # The bundled npm is used for the publish step itself; trusted publishing needs npm >= 11.5.1.
      - name: Set up Volta
        uses: volta-cli/action@v5

      - uses: actions/cache@v6
        with:
          path: ".yarn/cache"
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Wasm Pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - uses: Swatinem/rust-cache@v2

      # The wasm test helper is linked from package.json, so it must exist before installing
      - name: Build Rust wasm test helper
        run: cd tests/rust-arrow-ffi && yarn build && cd ../../

      - name: Install
        run: yarn install

      - name: Test
        run: yarn test

      # `prepublishOnly` cleans and rebuilds dist/ before the tarball is packed
      - name: Publish
        run: npm publish
